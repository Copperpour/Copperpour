[package]
name = "copperpour"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# Compile as both a binary (standalone MCP server) and a cdylib (KiCAD plugin)
[[bin]]
name = "copperpour"
path = "src/main.rs"

# The name before the rename: runs `copperpour` beside it. Kept for one release.
[[bin]]
name = "konnect"
path = "src/bin/konnect.rs"

[lib]
name = "copperpour_plugin"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
copperpour-core.workspace = true
copperpour-sexp.workspace = true
copperpour-ipc.workspace = true

serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
axum.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
dirs.workspace = true
fs4.workspace = true

[build-dependencies]

[dev-dependencies]
prost.workspace = true
serde_yaml_ng = "0.10"
tempfile = "3"
