# Where the vendored KiCad IPC protocol in proto/ came from (#67).
#
# proto/ is one KiCad tag's api/proto tree, byte for byte: generated Rust is
# built from it, never from hand-written message definitions. A sync replaces
# the whole tree from a new tag and rewrites this file. The test
# tests/proto_manifest_test.rs checks offline that proto/ holds exactly the
# files below with these SHA-256 hashes.

upstream = "https://gitlab.com/kicad/code/kicad"
tag = "10.0.8"
commit = "e432beac2668303194ba2040274f9e5efe773fc0"
commit_date = "2026-10-29"
synced = "2026-11-04"
source_root = "api/proto"

# KiCad versions this snapshot is meant to work with. Fields newer than the
# running KiCad are absent on the wire, so older 10.0 releases read the
# messages as they always did.
[supported]
oldest = "10.0.0"
newest = "10.0.8"

