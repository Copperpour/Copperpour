[package]
name = "copperpour-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
copperpour-sexp.workspace = true
copperpour-render.workspace = true
copperpour-ipc.workspace = true
copperpour-schematic-editor.workspace = true
topola_specctra.workspace = true

prost-types.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
csv.workspace = true
jsonschema.workspace = true
tokio.workspace = true
axum.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
base64.workspace = true
sha2.workspace = true
reqwest = { workspace = true, optional = true }
dirs.workspace = true
rusqlite = { workspace = true, optional = true }
usvg.workspace = true
zip = { workspace = true, optional = true }
tempfile = "3"

[features]
# Release builds ship everything. `--no-default-features` is the offline build:
# no outbound HTTP client and no vendor endpoints (#210). Cargo features only
# add code, so each integration adds itself; there is no `offline` feature.
default = ["jlcpcb", "freerouting", "native-bridge"]
# JLCPCB / LCSC parts catalog: the local cache, its download, the LCSC and
# EasyEDA lookups, and the order upload (#208). JLCPCB fabrication and assembly
# output don't need it.
jlcpcb = ["dep:rusqlite", "dep:reqwest", "dep:zip"]
# Freerouting discovery and headless routing: a Java subprocess, no network.
freerouting = ["dep:zip"]
# The KiCad plugin's native Specctra export bridge: HTTP to localhost only.
native-bridge = ["dep:reqwest"]

[target.'cfg(windows)'.dependencies]
winreg.workspace = true

[dev-dependencies]
# The pcb_components fallback tests spawn a mock KiCAD NNG endpoint to prove
# a reachable-but-rejecting KiCAD never triggers the file-editing fallback.
nng.workspace = true
