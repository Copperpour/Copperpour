name: Windows

# Check & Test on windows-latest, kept out of ci.yml so it has its own
# concurrency group and is not a required check yet (GOVERNANCE.md, "Where CI
# runs"). The Windows release build and the real-KiCad gate are in release.yml
# and e2e-kicad.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same PR or ref supersedes the previous run.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: protoc@3.23.4
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --locked
      - name: Test (unit + integration)
        run: cargo test --workspace --locked --lib --tests
      - name: Doctests
        run: cargo test --workspace --locked --doc
